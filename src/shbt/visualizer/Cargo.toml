[package]
name = "shbt-visualizer"
version = "0.2.0"
edition = "2021"
authors = ["sys1own"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "0.19", default-features = false, features = ["wgsl", "webgpu"] }
bytemuck = { version = "1.14", features = ["derive"] }
wasm-bindgen = "0.2.92"
wasm-bindgen-futures = "0.4.42"
web-sys = { version = "0.3.69", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "GpuCanvasContext",
    "Performance"
] }
console_error_panic_hook = "0.1.7"
log = "0.4.21"
console_log = "1.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.3.0"
winit = { version = "0.29", features = ["rwh_05"] }
