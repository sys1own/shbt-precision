[package]
name = "shbt_simulator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.22"
rug = "1.24"
rayon = "1.10"
num-rational = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gmp-mpfr-sys = { version = "1.7", features = ["c-no-tests"] }

[dev-dependencies.pyo3]
version = "0.22"
features = ["auto-initialize"]

[features]
extension-module = ["pyo3/extension-module"]
